; Render resolution per quality tier (same values as the StackAndEscape pipeline, measured there on an iPhone 13 Pro).
; Android: the engine's tiers render at 1280 pixels on the long side, which makes the HUD text blurry; 1.5 = about
; 1920 on the long side from Mid up. Low-end phones keep the engine's 0.8.
[Android_Mid DeviceProfile]
+CVars=r.MobileContentScaleFactor=1.5

[Android_High DeviceProfile]
+CVars=r.MobileContentScaleFactor=1.5

[Android_Epic DeviceProfile]
+CVars=r.MobileContentScaleFactor=1.5

[Android_Emulator DeviceProfile]
+CVars=r.MobileContentScaleFactor=0

; iOS: every iPhone tier renders at twice the point size (780x1688 on an iPhone 13 Pro). iPads keep the engine's 1.5.
[IOS_Mid DeviceProfile]
+CVars=r.MobileContentScaleFactor=2

[IOS_High DeviceProfile]
+CVars=r.MobileContentScaleFactor=2

[IOS_Epic DeviceProfile]
+CVars=r.MobileContentScaleFactor=2

; Weak devices (the engine's Low tier): 2x MSAA instead of 4x and 1.5x the points on iOS.
[IOS_Low DeviceProfile]
+CVars=r.MobileContentScaleFactor=1.5
+CVars=r.MSAACount=2

[Android_Low DeviceProfile]
+CVars=r.MSAACount=2
