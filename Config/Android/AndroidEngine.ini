[SystemSettings]
; UE 5.8's chunked Vulkan PSO cache (on by default on Android) asserts at startup when several threads build the
; same pipeline: "Assertion failed: PSO->VulkanPipeline == 0 [VulkanPipeline.cpp:2133]" (seen in StackAndEscape on
; the emulator, 2026-10-27). The classic pipeline cache is used instead.
r.Vulkan.UseChunkedPSOCache=0
